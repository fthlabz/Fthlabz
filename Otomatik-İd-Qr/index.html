<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FTHLABZ Matbaa PRO (Hızlı Okuma)</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body { background-color: #0f172a; color: white; font-family: 'Inter', sans-serif; }

        /* A4 KAĞIT AYARI (Sabit Boyut) */
        #a4-preview {
            width: 794px; 
            min-height: 1123px; 
            background: white;
            color: black;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(4, 1fr); 
            gap: 10px;
            align-content: start;
            margin: 0 auto;
        }

        /* MOBİLDE KAYDIRMA ÇUBUĞU */
        .preview-container {
            width: 100%;
            overflow-x: auto;
            background: #1e293b;
            padding: 20px 0;
            margin-top: 20px;
            border-top: 1px solid #334155;
        }

        /* ETİKET KUTUSU */
        .sticker {
            border: 1px dashed #e2e8f0;
            height: 140px; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 5px;
            text-align: center;
            background: white;
        }

        /* QR GÖRÜNÜMÜ (Keskinleştirmek için pixelated yaptık) */
        .sticker canvas, .sticker img {
            width: 100px !important; 
            height: 100px !important;
            image-rendering: pixelated; 
        }
    </style>
</head>
<body class="p-4 flex flex-col items-center min-h-screen">

    <div class="w-full max-w-md bg-gray-800 p-6 rounded-2xl border border-gray-700 shadow-xl">
        <h1 class="text-2xl font-bold text-center mb-4 text-blue-400"><i class="fa-solid fa-print"></i> Matbaa PRO</h1>
        
        <div class="grid grid-cols-2 gap-4 mb-4">
            <div>
                <label class="text-xs text-gray-400 font-bold ml-1">ADET</label>
                <input type="number" id="count" value="24" class="w-full bg-black border border-gray-600 rounded-lg py-3 text-center text-white font-bold outline-none focus:border-blue-500 transition">
            </div>
            <div>
                <label class="text-xs text-gray-400 font-bold ml-1">SERİ</label>
                <input type="text" id="prefix" value="URUN" class="w-full bg-black border border-gray-600 rounded-lg py-3 text-center text-white font-bold outline-none uppercase focus:border-blue-500 transition">
            </div>
        </div>

        <button onclick="generateLabels()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-xl shadow-lg mb-3 transition active:scale-95">
            ÖN İZLEME OLUŞTUR
        </button>
        
        <button id="download-btn" onclick="downloadImage()" class="w-full bg-green-600 hover:bg-green-500 text-white font-bold py-4 rounded-xl shadow-lg hidden transition active:scale-95">
            <i class="fa-solid fa-download mr-2"></i> GALERİYE KAYDET (HD)
        </button>
    </div>

    <div id="preview-section" class="preview-container hidden">
        <div id="a4-preview"></div>
    </div>

    <script>
        // Senin Stok Programının Linki
        const BASE_URL = "https://fthlabz.github.io/fthlabz-reklam/?id=";

        function generateLabels() {
            const count = document.getElementById('count').value || 24;
            const prefix = (document.getElementById('prefix').value || "URUN").toUpperCase();
            const container = document.getElementById('a4-preview');
            const previewSection = document.getElementById('preview-section');
            const downloadBtn = document.getElementById('download-btn');

            container.innerHTML = ""; 
            previewSection.classList.remove('hidden');
            
            // Benzersizlik için saniye bazlı ID
            const timestamp = Date.now().toString().slice(-6);

            for(let i=0; i<count; i++) {
                // Çakışmayı önlemek için rastgele sayı
                const randomPart = Math.floor(Math.random() * 90000) + 10000;
                const uniqueID = `${prefix}-${timestamp}-${randomPart}`;
                
                // Linkin tamamı (iPhone kamerasının açması için)
                const finalLink = BASE_URL + uniqueID;

                const sticker = document.createElement('div');
                sticker.className = 'sticker';

                const qrDiv = document.createElement('div');
                
                // 🔥 SİHİRLİ AYARLAR BURADA 🔥
                new QRCode(qrDiv, {
                    text: finalLink,
                    width: 256,   // Yüksek çözünürlükte üret
                    height: 256,
                    // L (Low) Seviyesi: En az siyah nokta, en ferah görünüm, en hızlı okuma!
                    correctLevel: QRCode.CorrectLevel.L 
                });

                const label = document.createElement('div');
                label.style.marginTop = "5px";
                label.innerHTML = `
                    <div style="font-weight:900; font-size:12px; color:black;">FTHLABZ</div>
                    <div style="font-family:monospace; font-size:10px; font-weight:bold; color:black;">${uniqueID}</div>
                `;

                sticker.appendChild(qrDiv);
                sticker.appendChild(label);
                container.appendChild(sticker);
            }

            downloadBtn.classList.remove('hidden');
            setTimeout(() => { previewSection.scrollIntoView({ behavior: 'smooth' }); }, 300);
        }

        function downloadImage() {
            const element = document.getElementById('a4-preview');
            const btn = document.getElementById('download-btn');
            
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> HAZIRLANIYOR...';
            btn.disabled = true;

            html2canvas(element, {
                scale: 3, // 🔥 3 Kat kalite (Yazıcıda jilet gibi çıkar)
                useCORS: true,
                backgroundColor: "#ffffff"
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = `FTHLABZ_Etiketler_${Date.now()}.jpg`;
                link.href = canvas.toDataURL('image/jpeg', 0.95);
                link.click();

                btn.innerHTML = originalText;
                btn.disabled = false;
                alert("Etiketler galeriye indi! Yazdırmaya hazır.");
            });
        }
    </script>
</body>
</html>
